name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'
    - name: fmt
      run: if [ -n "$(gofmt -l .)" ]; then exit 1; fi
    - name: vet
      run: go vet ./...
    - name: test
      run: go test -race ./...
    - name: build
      run: make build
